<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Page Not Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 30% 20%, rgba(255,140,0,0.1) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(224,79,22,0.06) 0%, transparent 50%),
                  #0f0a07;
      color: #fff;
      overflow: hidden;
      padding: 20px;
    }

    .error-wrapper {
      position: relative;
      max-width: 680px;
      width: 100%;
      text-align: center;
    }

    .error-box {
      padding: 60px 50px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 165, 0, 0.12);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5),
                  inset 0 1px 0 rgba(255, 255, 255, 0.06);
      position: relative;
    }

    .error-glow {
      position: absolute;
      inset: -80px;
      background: radial-gradient(circle, rgba(255, 140, 0, 0.12), transparent 70%);
      z-index: -1;
      border-radius: 50%;
      animation: glow-pulse 4s ease-in-out infinite;
    }

    @keyframes glow-pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    .error-code {
      font-size: 140px;
      font-weight: 800;
      background: linear-gradient(135deg, #ff8c00, #e04f16);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 10px;
      text-shadow: none;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .error-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .error-text {
      font-size: 15px;
      color: #b9a895;
      max-width: 460px;
      margin: 0 auto 36px;
      line-height: 1.7;
    }

    .error-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #ff8c00, #e04f16);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: 'Outfit', sans-serif;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(255, 140, 0, 0.3);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: transparent;
      color: #b9a895;
      border: 1px solid rgba(255, 165, 0, 0.15);
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: 'Outfit', sans-serif;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-back:hover {
      border-color: #ff8c00;
      color: #ff8c00;
    }

    .btn-contact {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: transparent;
      color: #b9a895;
      border: 1px solid rgba(255, 165, 0, 0.15);
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: 'Outfit', sans-serif;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-contact:hover {
      border-color: #ff8c00;
      color: #ff8c00;
    }

    /* Floating food icons */
    .float-icon {
      position: fixed;
      color: rgba(255, 140, 0, 0.08);
      font-size: 3rem;
      animation: drift 12s linear infinite;
      z-index: -1;
    }

    .float-icon:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; animation-duration: 15s; }
    .float-icon:nth-child(2) { top: 70%; left: 10%; animation-delay: 3s; animation-duration: 18s; }
    .float-icon:nth-child(3) { top: 20%; right: 8%; animation-delay: 6s; animation-duration: 20s; }
    .float-icon:nth-child(4) { top: 80%; right: 5%; animation-delay: 2s; animation-duration: 16s; }
    .float-icon:nth-child(5) { top: 40%; left: 85%; animation-delay: 4s; animation-duration: 14s; }

    @keyframes drift {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.3; }
      50% { transform: translateY(-40px) rotate(15deg); opacity: 0.6; }
      100% { transform: translateY(0) rotate(0deg); opacity: 0.3; }
    }

    @media (max-width: 480px) {
      .error-code { font-size: 90px; }
      .error-title { font-size: 22px; }
      .error-box { padding: 40px 24px; }
      .error-actions { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>

<!-- Floating food icons -->
<i class="bi bi-egg-fried float-icon"></i>
<i class="bi bi-cup-hot float-icon"></i>
<i class="bi bi-cake2 float-icon"></i>
<i class="bi bi-fire float-icon"></i>
<i class="bi bi-flower1 float-icon"></i>

<div class="error-wrapper">
  <div class="error-box">
    <div class="error-glow"></div>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-text">
      Oops! It seems the page you're looking for has been moved, deleted, or never existed. 
      Don't worry — there's plenty of delicious content waiting for you on our other pages.
    </p>
    <div class="error-actions">
      <a href="index.html" class="btn-home">
        <i class="bi bi-house-door"></i> Go Home
      </a>
      <a href="javascript:history.back()" class="btn-back">
        <i class="bi bi-arrow-left"></i> Go Back
      </a>
      <a href="contact.html" class="btn-contact">
        <i class="bi bi-envelope"></i> Contact Support
      </a>
    </div>
  </div>
</div>

</body>
</html>
